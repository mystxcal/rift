[workspace]
resolver = "3"
members = [
    "crates/rift-core",
    "crates/rift-protocol",
    "crates/rift-transport",
    "crates/rift-runtime",
    "crates/rift-cli",
    "crates/rift-relay",
    "crates/rift-lab",
]

[workspace.package]
version = "0.1.0-alpha.6"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
asupersync = { version = "=0.4.9", default-features = false, features = ["proc-macros", "tls", "tls-webpki-roots"] }
blake3 = "1.8.2"
bytes = "=1.11.1"
clap = { version = "4.5.46", features = ["derive"] }
crc32fast = "=1.5.0"
data-encoding = "2.9.0"
pakery-core = "=0.2.1"
pakery-crypto = { version = "=0.2.1", default-features = false, features = ["std", "p256", "spake2"] }
pakery-spake2 = { version = "=0.2.1", default-features = false, features = ["std"] }
rand_core = { version = "=0.9.3", features = ["os_rng"] }
quinn-proto = { version = "=0.11.17", default-features = false, features = ["rustls"] }
rcgen = "=0.14.9"
turn-client-proto = "=0.7.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
snow = "0.10.0"
subtle = "2.6.1"
thiserror = "2.0.16"
unicode-normalization = "0.1.25"
zeroize = { version = "1.8.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
